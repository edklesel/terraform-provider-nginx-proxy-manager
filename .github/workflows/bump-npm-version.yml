name: Bump SDK matrix versions

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  bump-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: pip install ruamel.yaml requests

      - name: Update workflow matrix
        run: |
            python3 -m pip install ci/update-versions/requirements.yaml
            python3 ci/update-versions/update-versions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: update SDK version matrix"
          title: "chore: update SDK version matrix"
          branch: bump/sdk-versions
          body: |
            Automated update of SDK version matrix:
            - Last 5 minor versions (as `maj.min`)
            - Last 5 patch versions of the latest minor (as `maj.min.patch`)
