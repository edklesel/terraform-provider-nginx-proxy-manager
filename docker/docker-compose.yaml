services:
  npm:
    image: jc21/nginx-proxy-manager:${NPM_VERSION:-2.16.0}
    ports:
    - 81:81
    volumes:
    - ${PWD}/docker/npm:/data
    - npm_letsencrypt:/etc/letsencrypt
    - step-ca:/step-ca
    container_name: npm
    environment:
      PUID: "${NPM_UID}"
      PGID: "${NPM_GID}"
      DB_MYSQL_HOST: "npm-db"
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: "npm"
      DB_MYSQL_PASSWORD: "npm"
      DB_MYSQL_NAME: "npm"
      LE_SERVER: "https://ca.testing:9000/acme/acme/directory"
      REQUESTS_CA_BUNDLE: "/step-ca/certs/root_ca.crt"
    networks:
      testing:
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
  
  npm-db:
    image: mariadb:12.0.2
    container_name: npm-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    environment:
      MYSQL_ROOT_PASSWORD: "npm"
      MYSQL_DATABASE: "npm"
      MYSQL_USER: "npm"
      MYSQL_PASSWORD: "npm"
    volumes:
      - npm_db:/var/lib/mysql
      - ${PWD}/docker/npm.sql:/docker-entrypoint-initdb.d/npm.sql
    networks:
      testing:

  pdns:
    image: pschiffe/pdns-mysql:4.8
    container_name: pdns
    environment:
      PDNS_master: 'yes'
      PDNS_api: 'yes'
      PDNS_api_key: 'npm'
      PDNS_webserver: 'yes'
      PDNS_webserver_address: '0.0.0.0'
      PDNS_webserver_password: 'npm'
      PDNS_webserver-allow-from: '127.0.0.0/8,192.0.0.0/8,10.0.0.0/8,172.0.0.0/8'
      PDNS_version_string: 'anonymous'
      PDNS_default_ttl: 1500
      PDNS_allow_axfr_ips: '127.0.0.0/8,192.0.0.0/8,10.0.0.0/8,172.0.0.0/8'
      PDNS_gmysql_host: pdns-db
      PDNS_gmysql_port: 3306
      PDNS_gmysql_user: pdns
      PDNS_gmysql_password: pdns
      PDNS_gmysql_dbname: pdns
    ports:
    - 8081:8081
    depends_on:
      - pdns-db
    networks:
      testing:
        ipv4_address: 172.20.100.2
        aliases:
          - ns1.pdns
          - ns2.pdns

  pdns-db:
    image: mariadb:12.0.2
    container_name: pdns-db
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    environment:
      MYSQL_ROOT_PASSWORD: 'pdns'
      MYSQL_DATABASE: 'pdns'
      MYSQL_USER: 'pdns'
      MYSQL_PASSWORD: 'pdns'
    volumes:
      - pdns_mysql_vol:/var/lib/mysql
      - ${PWD}/docker/pdns.sql:/docker-entrypoint-initdb.d/pdns.sql
    networks:
      - testing

  step-ca:
    image: smallstep/step-ca:0.28.4
    container_name: step-ca
    volumes:
    - step-ca:/home/step
    - ${PWD}/docker/step-ca/resolv.conf:/etc/resolv.conf:ro
    - ${PWD}/docker/step-ca/hosts:/etc/hosts:ro
    ports:
    - 9000:9000
    environment:
      DOCKER_STEPCA_INIT_NAME: ca-testing
      DOCKER_STEPCA_INIT_DNS_NAMES: ca.testing
      DOCKER_STEPCA_INIT_ACME: "true"
    networks:
      testing:
        aliases:
          - ca.testing
  
  dnsrouter:
    image: jc21/dnsrouter
    container_name: dnsrouter
    volumes:
      - ${PWD}/docker/dnsrouter-config.json:/dnsrouter-config.json:ro
    networks:
      testing:
        ipv4_address: 172.20.100.3

volumes:
  pdns_mysql_vol:
  db:
  npm_letsencrypt:
  npm_db:
  step-ca:

networks:
  testing:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16